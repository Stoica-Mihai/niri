name: Fork release

# Builds the fork niri binary in an Arch container (matches Arch/CachyOS, unlike
# the Ubuntu CI) and attaches it to a GitHub Release.
#   - push a tag `mcs-v<rev>` (e.g. mcs-v1), or
#   - run manually with a rev input.
# Version string baked in = "<niri-base-tag>+mcs.<rev>", same scheme as build-fork.sh.

on:
  push:
    tags: ['mcs-v*']
  workflow_dispatch:
    inputs:
      rev:
        description: 'Fork rev number (creates tag mcs-v<rev>)'
        required: true
        default: '1'

jobs:
  # Don't publish a release for a commit whose CI is failing or unfinished. Cross-workflow `needs:`
  # doesn't exist, so poll the CI run for this exact commit instead.
  verify-ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Only the jobs that validate the code we're about to ship. Upstream's cross-platform
          # jobs (freebsd, nix, alpine, fedora) run third-party VM actions that fail on their own
          # infrastructure often enough to block releases, and say nothing about an Arch binary.
          required=(test clippy rustfmt msrv "check feature combinations")

          for attempt in $(seq 1 90); do
            # A commit can have several CI runs (a branch push and a tag push produce one each).
            # Accept a required job as green if it succeeded in any of them.
            declare -A green=()
            any_running=0
            for run in $(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '.workflow_runs[].id'); do
              while IFS=$'\t' read -r name conclusion; do
                case "$conclusion" in
                  success) green["$name"]=1 ;;
                  pending) any_running=1 ;;
                esac
              done < <(gh api "repos/$REPO/actions/runs/$run/jobs" \
                --jq '.jobs[] | [.name, (.conclusion // "pending")] | @tsv')
            done

            missing=()
            for job in "${required[@]}"; do
              [ -n "${green[$job]:-}" ] || missing+=("$job")
            done

            if [ ${#missing[@]} -eq 0 ]; then
              echo "all required jobs green for $SHA"
              exit 0
            fi

            echo "attempt $attempt: waiting on: ${missing[*]}"
            if [ "$any_running" -eq 0 ]; then
              echo "::error::required CI jobs did not pass for $SHA: ${missing[*]}"
              exit 1
            fi

            sleep 20
          done

          echo "::error::timed out waiting for CI to finish for $SHA."
          exit 1

  release:
    needs: verify-ci
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      # nodejs must be present before any JS action (actions/checkout) runs in the container.
      - name: Install toolchain + deps
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel nodejs tar gzip \
            rust clang pkgconf \
            wayland wayland-protocols libxkbcommon libinput mesa seatd \
            systemd-libs pipewire pango cairo libdisplay-info libadwaita dbus

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version + tag
        id: v
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REV="${{ github.event.inputs.rev }}"
            TAG="mcs-v${REV}"
          else
            TAG="${GITHUB_REF_NAME}"
            REV="${TAG#mcs-v}"
          fi
          echo "ver=${BASE#v}+mcs.${REV}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: NIRI_BUILD_VERSION_STRING="${{ steps.v.outputs.ver }}" cargo build --release --locked

      - name: Package
        run: |
          cd target/release
          tar czf "$GITHUB_WORKSPACE/niri-${{ steps.v.outputs.ver }}-x86_64-arch.tar.gz" niri

      # Generated, not hardcoded: naming specific features here goes stale the moment the fork
      # gains another one.
      - name: Compose release notes
        run: |
          PREV=$(git tag --list 'mcs-v*' --sort=-creatordate \
                 | grep -Fxv "${{ steps.v.outputs.tag }}" | head -1)
          {
            echo "Fork build of niri. The fork-only features and their config options are" \
                 "documented in [FORK.md](https://github.com/${{ github.repository }}/blob/main/FORK.md)."
            echo
            echo "Version: \`${{ steps.v.outputs.ver }}\`. Built in an Arch Linux container (glibc),"
            echo "so it targets Arch/CachyOS. If it fails to run due to library drift, build locally"
            echo "with \`./build-fork.sh\` — that always matches your system."
            echo
            echo "Install: \`sudo install -Dm755 niri /usr/local/bin/niri\`, then relog."
            if [ -n "$PREV" ]; then
              echo
              echo "### Changes since $PREV"
              echo
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: niri ${{ steps.v.outputs.ver }}
          body_path: release-notes.md
          files: niri-*-x86_64-arch.tar.gz
          fail_on_unmatched_files: true
